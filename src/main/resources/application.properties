# ==========================================
# Application Configuration
# ==========================================
spring.application.name=api-gestion-ventas
server.port=8080

# ==========================================
# Database Configuration (H2 Default for Instant Run / Dev)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:ventasdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# PostgreSQL Alternative (Uncomment or override with Env Variables):
# spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=admin123

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# Enable H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==========================================
# Security & JWT Configuration
# ==========================================
# Secret key (at least 256 bits for HMAC-SHA256)
jwt.secret=${JWT_SECRET:9a4f2c8d7e1b5a3f6c8e0d2b4a6f8e1d3c5b7a9f2e4d6c8b0a2f4e6d8c0b2a4f}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# SpringDoc / OpenAPI Swagger Configuration
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ==========================================
# JSON Formatting
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null